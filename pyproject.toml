[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-stlink-flasher"
version = "0.1.0.4"
description = "Batch-flash multiple STM32 targets via ST-Link V2 and OpenOCD"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BatchSTLinkFlasher contributors" }]
dependencies = [
  "PySide6>=6.6",
  "pyusb>=1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.4",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
packaging = [
  "pyinstaller>=6.0",
]

[project.scripts]
batch-stlink-flasher = "batch_stlink_flasher.__main__:main"
batch-stlink-discover = "batch_stlink_flasher.discover:main"
batch-stlink-flash = "batch_stlink_flasher.flash:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
batch_stlink_flasher = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=batch_stlink_flasher --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = false
source = ["batch_stlink_flasher"]
omit = [
  "*/batch_stlink_flasher/__main__.py",
  "*/batch_stlink_flasher/app.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"
